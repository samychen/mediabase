name: ci

on:
  push:
  pull_request:

# One job per GREEN/RED UNIT — the base, then each product's own planes.
#
# These are separate jobs on purpose, and none of them `needs` another. When every
# step lived in one `quality` job, a red base gate (a flaky timing test, say) turned
# the whole run red BEFORE the product steps had even run, so a product regression
# and a base regression looked identical from the outside: "ci failed". Split, the
# failing job names the thing that failed, and the four products cannot hide each
# other or be hidden by the base.
#
# What each job still shares is the toolchain: .github/actions/setup is the single
# copy of the pnpm/Node versions, so a job added later cannot quietly install with a
# different pnpm major (`-r` semantics, workspace filters).
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (host + client + tests)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Composition gate: the composition is DATA, so a row naming a package the
      # manifest does not depend on, a `!!js` expression in a field the Loader never
      # interpolates, or a patch targeting an id no layer declares would otherwise
      # surface only when a specific deployment boots.
      - name: Composition gate
        run: pnpm run verify:compose

      - name: Test (rpc + registries + UI + host; browserless)
        run: pnpm test
        env:
          CI: 'true'
          MEDIABASE_NO_BROWSER: '1'

      - name: Build web
        run: pnpm run build:web

      # Boot gate: the single-file host composes from its closed runtime. Base-only
      # — no engine build.
      - name: Single-file host boots from its closed runtime
        run: |
          set -euo pipefail
          pnpm run build:host
          MEDIABASE_HOME="$RUNNER_TEMP/mediabase-bundle-home" PORT=3098 \
            node build/host.cjs > /tmp/hostbundle.log 2>&1 &
          host=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3098/api/health > /dev/null; then break; fi
            if ! kill -0 "$host" 2>/dev/null; then echo 'host bundle exited early'; cat /tmp/hostbundle.log; exit 1; fi
            sleep 1
          done
          MEDIABASE_URL=http://127.0.0.1:3098 node scripts/verify.base.mjs
          kill -TERM "$host"
          wait "$host" || true
          cat /tmp/hostbundle.log

      - name: Boot with strict capability verification
        run: |
          set -euo pipefail
          PORT=3099 MEDIABASE_STRICT_CAPABILITIES=1 MEDIABASE_DIST_INDEX=apps/web/dist/index.html \
            MEDIABASE_HOME="$RUNNER_TEMP/mediabase-home" \
            node --import tsx apps/cli/src/index.ts > /tmp/host.log 2>&1 &
          host=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3099/api/health > /tmp/health.json; then break; fi
            if ! kill -0 "$host" 2>/dev/null; then echo 'host exited early'; cat /tmp/host.log; exit 1; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          kill -TERM "$host"
          wait "$host" || true
          cat /tmp/host.log

  product-openvideo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The in-repo product layer (product/openvideo) has its own planes, suite
      # and smoke — the base gates do not cover it, and it must not rot.
      - name: Typecheck
        run: pnpm run typecheck:openvideo

      - name: Composition gate
        run: pnpm run verify:openvideo:compose

      - name: Test
        run: pnpm run test:openvideo

      - name: Build + smoke
        run: |
          set -euo pipefail
          pnpm run build:openvideo
          pnpm run verify:openvideo

  product-mediamtx-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The second product (product/mediamtx-console) has the same gates. Its
      # live-server suites SKIP without a mediamtx binary (the smoke then runs
      # in DEGRADED mode: coded failures against an unreachable server), so CI
      # needs no extra download to stay green.
      - name: Typecheck
        run: pnpm run typecheck:mtxconsole

      - name: Composition gate
        run: pnpm run verify:mtxconsole:compose

      - name: Test
        run: pnpm run test:mtxconsole

      - name: Build + smoke
        run: |
          set -euo pipefail
          pnpm run build:mtxconsole
          pnpm run verify:mtxconsole

  product-highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The fourth product (product/highlight) is a TS host + a Python sidecar.
      # The sidecar is only needed by the `real` smoke, which is deliberately NOT
      # here: it needs a model stack to say anything the fake bridge cannot, and
      # a gate that skips when OpenCV is absent teaches people to ignore it.
      # What CI does enforce is that the bridge's OWN logic holds — it is product
      # code with no upstream suite behind it — and that the end-to-end path over
      # the protocol works against the Node fake.
      - name: Typecheck
        run: pnpm run typecheck:highlight

      - name: Composition gate
        run: pnpm run verify:highlight:compose

      - name: Contract gate (engine copy + protocol + roster drift)
        run: pnpm run check:highlight-drift

      - name: Test (host, journal, metrics, timeline)
        run: pnpm run test:highlight

      - name: Test (python bridge)
        run: pnpm run test:highlight:py

      - name: Build + smoke (fake bridge)
        run: |
          set -euo pipefail
          pnpm run build:highlight
          pnpm run verify:highlight:fake

  product-xmedia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The third product (product/xmedia) is a TS host over a C++ engine. CI
      # runs the Node fake engine (no toolchain, no MediaMTX): the smoke then
      # asserts the control plane, the retired-surface rules and the page, and
      # skips only the live RTMP publish, which needs a real server. The real
      # engine build stays a release step — same reason as highlight's `real`.
      - name: Typecheck
        run: pnpm run typecheck:xmedia

      - name: Composition gate
        run: pnpm run verify:xmedia:compose

      - name: Test
        run: pnpm run test:xmedia

      - name: Smoke (fake engine)
        run: pnpm run verify:xmedia
