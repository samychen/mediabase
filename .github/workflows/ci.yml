name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
        env:
          CI: 'true'

      - name: Typecheck (host + client + tests)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Composition gate: the composition is DATA, so a row naming a package the
      # manifest does not depend on, a `!!js` expression in a field the Loader never
      # interpolates, or a patch targeting an id no layer declares would otherwise
      # surface only when a specific deployment boots.
      - name: Composition gate
        run: pnpm run verify:compose

      - name: Test (rpc + registries + UI + host; browserless)
        run: pnpm test
        env:
          CI: 'true'
          MEDIABASE_NO_BROWSER: '1'

      - name: Build web
        run: pnpm run build:web

      # Boot gate: the single-file host composes from its closed runtime. Base-only
      # — no engine build.
      - name: Single-file host boots from its closed runtime
        run: |
          set -euo pipefail
          pnpm run build:host
          MEDIABASE_HOME="$RUNNER_TEMP/mediabase-bundle-home" PORT=3098 \
            node build/host.cjs > /tmp/hostbundle.log 2>&1 &
          host=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3098/api/health > /dev/null; then break; fi
            if ! kill -0 "$host" 2>/dev/null; then echo 'host bundle exited early'; cat /tmp/hostbundle.log; exit 1; fi
            sleep 1
          done
          MEDIABASE_URL=http://127.0.0.1:3098 node scripts/verify.base.mjs
          kill -TERM "$host"
          wait "$host" || true
          cat /tmp/hostbundle.log

      - name: Boot with strict capability verification
        run: |
          set -euo pipefail
          PORT=3099 MEDIABASE_STRICT_CAPABILITIES=1 MEDIABASE_DIST_INDEX=apps/web/dist/index.html \
            MEDIABASE_HOME="$RUNNER_TEMP/mediabase-home" \
            node --import tsx apps/cli/src/index.ts > /tmp/host.log 2>&1 &
          host=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3099/api/health > /tmp/health.json; then break; fi
            if ! kill -0 "$host" 2>/dev/null; then echo 'host exited early'; cat /tmp/host.log; exit 1; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          kill -TERM "$host"
          wait "$host" || true
          cat /tmp/host.log

      # The in-repo product layer (product/openvideo) has its own planes, suite
      # and smoke — the base gates above do not cover it, and it must not rot.
      - name: Product typecheck (openvideo)
        run: pnpm run typecheck:openvideo

      - name: Product composition gate (openvideo)
        run: pnpm run verify:openvideo:compose

      - name: Product test (openvideo)
        run: pnpm run test:openvideo

      - name: Product build + smoke (openvideo)
        run: |
          set -euo pipefail
          pnpm run build:openvideo
          pnpm run verify:openvideo
