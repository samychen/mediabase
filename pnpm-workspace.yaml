# pnpm >= 10 reads workspace settings from this file, not from .npmrc.
# Internal @mediabase/* dependencies are declared as semver on purpose (see
# .npmrc): they must resolve to the in-repo copies, never to the registry.
linkWorkspacePackages: true

packages:
  - 'packages/*'
  - 'packages/*/*'
  - 'apps/*'
  # in-repo product layers: self-contained trees that consume the base as their
  # foundation (see docs/HANDOFF.zh.md); @mediabase/* never imports them.
  - 'product/*/packages/*'
  - 'product/*/packages/*/*'
  - 'product/*/apps/*'
allowBuilds:
  esbuild: true
