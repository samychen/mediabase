<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVStudio — plugin skeleton</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
             background: #0d1117; color: #c9d1d9; }
      .app { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
      .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .sub { color: #8b949e; font-size: 12px; margin-bottom: 14px; }
      label { display: block; font-size: 12px; color: #8b949e; margin: 10px 0 4px; }
      input[type=text], input[type=number] { width: 100%; background: #0d1117; border: 1px solid #30363d;
             color: #c9d1d9; border-radius: 6px; padding: 7px 9px; font-size: 13px; }
      button { background: #238636; border: none; color: #fff; padding: 8px 12px; border-radius: 6px;
             font-size: 13px; cursor: pointer; margin-right: 6px; margin-top: 6px; }
      button.secondary { background: #21262d; border: 1px solid #30363d; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .monitor { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      canvas { background: #000; border: 1px solid #30363d; border-radius: 8px; max-width: 100%; image-rendering: pixelated; }
      .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
      .badge.on { background: #1f6f3c; color: #fff; }
      .badge.off { background: #3a2424; color: #f85149; }
      .status { font-size: 12px; color: #8b949e; margin-top: 10px; min-height: 16px; }
      code { background: #0d1117; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
