<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mediabase</title>
    <style>
      /* LAYOUT ONLY. The element recipes (body/buttons/fields/badges/status/…)
         are shared with every page through @mediabase/theme/chrome.css,
         imported by src/main.tsx — one source, tokenized, with literal
         fallbacks so a theme-less composition still renders the classic
         shell. What remains here is what only THIS page owns: the base
         shell's two-pane grid and its panel cards. */
      :root { color-scheme: dark; }
      .app { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
      .panel { background: var(--panel, #161b22); border: 1px solid var(--border, #30363d);
             border-radius: var(--radius, 10px); padding: 16px; box-shadow: var(--shadow, none); }
      h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px;
             display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .monitor { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      canvas { background: #000; border: none; box-shadow: inset 0 0 0 1px var(--border, #30363d);
             border-radius: calc(var(--radius, 10px) * 0.8); max-width: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
