<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVideo</title>
    <style>
      /* Page chrome consumes the design TOKENS (@mediabase/theme injects the
         values per skin; the literals are fallbacks so the page renders the
         classic dark look even without the theme row). Component styles live
         in @openvideo/ui-editor (styles.css), scoped to .ov-*. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
             background: var(--bg, #0d1117); color: var(--text, #c9d1d9); }
      .app { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
      .panel { background: var(--panel, #161b22); border: 1px solid var(--border, #30363d);
             border-radius: var(--radius, 10px); padding: 16px; box-shadow: var(--shadow, none); }
      h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .sub { color: var(--muted, #8b949e); font-size: 12px; margin-bottom: 14px; }
      label { display: block; font-size: 12px; color: var(--muted, #8b949e); margin: 10px 0 4px; }
      input[type=text], input[type=number], select, textarea {
             width: 100%; background: var(--inset, #0d1117); border: 1px solid var(--border, #30363d);
             color: var(--text, #c9d1d9); border-radius: calc(var(--radius, 10px) * 0.6); padding: 7px 9px; font-size: 13px; }
      input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
             outline: 2px solid var(--accent, #58a6ff); outline-offset: 1px; }
      button { background: var(--primary, #238636); border: none; color: var(--primary-text, #fff);
             padding: 8px 12px; border-radius: calc(var(--radius, 10px) * 0.6);
             font-size: 13px; cursor: pointer; margin-right: 6px; margin-top: 6px;
             transition: filter .12s ease; }
      button:hover:not(:disabled) { filter: brightness(1.12); }
      button.secondary { background: var(--panel, #21262d); border: 1px solid var(--border, #30363d);
             color: var(--text, #c9d1d9); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      /* The monitor column stacks the player above the timeline. */
      .monitor { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; }
      canvas { background: #000; border: 1px solid var(--border, #30363d);
             border-radius: calc(var(--radius, 10px) * 0.8); max-width: 100%; }
      .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
      .status { font-size: 12px; color: var(--muted, #8b949e); margin-top: 10px; min-height: 16px; }
      code { background: var(--inset, #0d1117); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .theme-picker { width: auto !important; font-size: 12px; padding: 3px 6px; margin: 0;
             background: var(--inset, #0d1117); border: 1px solid var(--border, #30363d);
             color: var(--text, #c9d1d9); border-radius: 999px; cursor: pointer; }
      * { scrollbar-color: var(--border, #30363d) transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
