<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xmedia · 转码控制台</title>
<style>
  /* ---- 主题 token（全部收敛在 :root，方便设计模式直接改） ---- */
  :root {
    --xm-bg: #f5f6f8;
    --xm-panel: #ffffff;
    --xm-panel-soft: #fbfcfe;
    --xm-border: #e4e8ee;
    --xm-text: #283142;
    --xm-muted: #788292;
    --xm-faint: #98a1b0;
    --xm-accent: #5686fe;
    --xm-accent-strong: #4176e6;
    --xm-accent-soft: #edf3fe;
    --xm-ok: #1a7f37;
    --xm-ok-soft: #dafbe1;
    --xm-warn: #9a6700;
    --xm-warn-soft: #fff8c5;
    --xm-danger: #cf222e;
    --xm-danger-soft: #ffebe9;
    --xm-side-w: 232px;
    --xm-radius: 12px;
    --xm-shadow: 0 1px 2px rgba(20, 30, 50, 0.05);
    --xm-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --xm-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--xm-bg); color: var(--xm-text);
    font: 14px/1.6 var(--xm-font);
  }

  /* ---- 左侧导航 ---- */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--xm-side-w);
    background: var(--xm-panel-soft); border-right: 1px solid var(--xm-border);
    display: flex; flex-direction: column; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--xm-accent) 0%, var(--xm-accent-strong) 100%);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .brand b { font-size: 15px; letter-spacing: 0.2px; }
  .brand small { display: block; color: var(--xm-muted); font-size: 11px; line-height: 1.3; }
  .nav { flex: 1; padding: 4px 10px 10px; overflow-y: auto; }
  .nav-group {
    margin: 14px 8px 4px; font-size: 11px; color: var(--xm-faint);
    letter-spacing: 0.6px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; margin: 1px 0; border: 0; border-radius: 8px;
    background: none; color: var(--xm-text); font: inherit; cursor: pointer;
    text-align: left;
  }
  .nav-item:hover { background: #eef1f6; }
  .nav-item.active { background: var(--xm-accent-soft); color: var(--xm-accent-strong); font-weight: 600; }
  .nav-item svg { width: 16px; height: 16px; flex: none; }
  .side-foot {
    margin: 10px; padding: 10px 12px; border: 1px solid var(--xm-border);
    border-radius: 10px; background: var(--xm-panel); font-size: 12px; color: var(--xm-muted);
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--xm-faint); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: #2da44e; box-shadow: 0 0 0 3px rgba(45, 164, 78, 0.15); }
  .dot.bad { background: var(--xm-danger); }

  /* ---- 主内容区 ---- */
  main { margin-left: var(--xm-side-w); padding: 26px 34px 120px; max-width: 1060px; }
  .view { display: none; }
  .view.active { display: block; animation: fade 160ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .view-head { margin: 0 0 16px; }
  .view-head h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .view-head p { margin: 0; color: var(--xm-muted); font-size: 13px; line-height: 1.7; }

  .panel {
    background: var(--xm-panel); border: 1px solid var(--xm-border);
    border-radius: var(--xm-radius); padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--xm-shadow);
  }
  .panel h2 { font-size: 13px; font-weight: 700; margin: 0 0 12px; color: var(--xm-text); }
  .hint { font-size: 12px; color: var(--xm-muted); line-height: 1.7; margin: 10px 0 0; }
  .hint strong { color: var(--xm-text); }

  input, button { font: inherit; }
  input {
    padding: 7px 10px; border: 1px solid var(--xm-border); border-radius: 8px;
    background: #fff; color: var(--xm-text); font-family: var(--xm-mono); font-size: 12.5px;
  }
  input:focus { outline: 2px solid var(--xm-accent-soft); border-color: var(--xm-accent); }
  input::placeholder { color: var(--xm-faint); }
  .btn {
    padding: 7px 14px; border: 1px solid var(--xm-border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: var(--xm-panel-soft); border-color: #d0d7de; }
  .btn.primary {
    background: var(--xm-accent); border-color: var(--xm-accent); color: #fff; font-weight: 600;
  }
  .btn.primary:hover { background: var(--xm-accent-strong); }
  pre {
    margin: 0; white-space: pre-wrap; word-break: break-all;
    font: 12px/1.6 var(--xm-mono); color: var(--xm-muted);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 320px; }
  .label { font-size: 12px; color: var(--xm-muted); white-space: nowrap; }
  #video, #bake-video {
    display: block; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px;
  }
  #player-state { margin-top: 10px; font-size: 12px; color: var(--xm-muted); }
  #urls { margin-top: 8px; font-size: 11.5px; color: var(--xm-muted); word-break: break-all; font-family: var(--xm-mono); }

  /* ---- 任务表格 ---- */
  table.jobs { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  table.jobs th {
    text-align: left; padding: 6px 8px; color: var(--xm-faint); font-weight: 600;
    font-size: 11px; border-bottom: 1px solid var(--xm-border); white-space: nowrap;
  }
  table.jobs td { padding: 8px; border-bottom: 1px solid #eef1f5; vertical-align: middle; }
  table.jobs tbody tr:hover { background: var(--xm-panel-soft); }
  table.jobs td.path { word-break: break-all; color: var(--xm-muted); font-family: var(--xm-mono); font-size: 11.5px; }
  .bar {
    position: relative; background: #e9edf3; border-radius: 99px; height: 8px;
    width: 130px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px;
  }
  .bar > i {
    position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--xm-accent);
    border-radius: 99px; transition: width 400ms ease;
  }
  .bar.paused > i { background: #d4a72c; }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px;
    font-size: 11px; white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; }
  .badge.run   { background: var(--xm-accent-soft); color: var(--xm-accent-strong); }
  .badge.pause { background: var(--xm-warn-soft); color: var(--xm-warn); }
  .badge.done  { background: var(--xm-ok-soft); color: var(--xm-ok); }
  .badge.cancel { background: #eef1f5; color: var(--xm-muted); }
  .badge.fail  { background: var(--xm-danger-soft); color: var(--xm-danger); }
  td button { padding: 3px 10px; font-size: 11.5px; margin-right: 4px; border-radius: 7px; }

  /* ---- 调用结果抽屉（全局） ---- */
  .console {
    position: fixed; left: var(--xm-side-w); right: 0; bottom: 0; z-index: 9;
    border-top: 1px solid var(--xm-border); background: var(--xm-panel);
  }
  .console-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 18px; cursor: pointer;
    font-size: 12px; color: var(--xm-muted); user-select: none;
  }
  .console-bar:hover { background: var(--xm-panel-soft); }
  .console-bar .chev { transition: transform 150ms ease; }
  .console.open .chev { transform: rotate(180deg); }
  .console-chip { margin-left: auto; font-family: var(--xm-mono); font-size: 11px; color: var(--xm-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  #out {
    max-height: 0; overflow: auto; padding: 0 18px; transition: max-height 180ms ease, padding 180ms ease;
    border-top: 1px solid transparent;
  }
  .console.open #out { max-height: 200px; padding: 12px 18px 14px; border-top-color: var(--xm-border); }

  /* ---- 窄屏：侧栏收成顶部图标栏 ---- */
  @media (max-width: 960px) {
    :root { --xm-side-w: 64px; }
    .brand b, .brand small, .nav-item span, .nav-group, .side-foot { display: none; }
    .brand { justify-content: center; padding: 14px 0 6px; }
    .nav-item { justify-content: center; padding: 10px 0; }
    main { padding: 20px 20px 120px; }
    .console { left: var(--xm-side-w); }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">xm</div>
    <div><b>xmedia</b><small>xmedia-kit 转码服务</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><span class="dot" id="side-dot"></span><span id="side-engine">引擎状态读取中…</span></div>
</aside>

<main id="main"></main>

<!-- 调用结果抽屉（全局） -->
<div class="console" id="console">
  <div class="console-bar" id="console-toggle">
    <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    <span>最近调用</span>
    <span class="console-chip" id="console-chip">—</span>
  </div>
  <pre id="out">—</pre>
</div>

<script type="module">
// ============================================================================
// xmedia 壳（shell）：布局 + 插件 loader + 响应式面板 registry + 路由 + 调用抽屉。
// 页面本身不含任何业务视图 —— 所有视图都是插件。
//
// 插件契约（刻意对齐基座 @mediabase/ui 的 UiPanel，packages/client/ui/src/index.ts，
// 未来迁基座 web shell 时可机械平移）：
//   export default {
//     id: 'monitor',        // 唯一；重复注册抛错（同基座）
//     title: '转码监控',     // 侧栏文案
//     area: 'sidebar',      // 对齐基座 PanelArea；本壳只实现 sidebar
//     order: 20,            // 越小越靠前；缺省按 manifest 顺序
//     icon: '<svg …>',      // 内联 SVG 字符串
//     mount(el, ctx) {},    // ctx = { call, show, ui }；首次激活时调用一次
//     // unmount?(el) 可选；不提供则切换视图仅隐藏（状态保留）
//   }
// 新功能 = 在 plugins/ 加一个 .js + manifest.json 一行，无需改本文件。
// ============================================================================

const $ = (id) => document.getElementById(id)

// ---- WS 控制面（媒体字节从不走这里）：CONNECTING 时排队，绝不静默丢弃 ------
const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws'
const token = new URLSearchParams(location.search).get('token')
const query = token ? `?token=${encodeURIComponent(token)}` : ''
const ws = new WebSocket(`${wsProtocol}://${location.host}/rpc${query}`)
let nextId = 1
const pending = new Map()
const queued = []

ws.addEventListener('message', (event) => {
  const res = JSON.parse(event.data)
  const slot = pending.get(res.id)
  if (!slot) return
  pending.delete(res.id)
  slot(res.error ? { error: res.error } : res.result)
})
ws.addEventListener('open', () => {
  while (queued.length) {
    const item = queued.shift()
    ws.send(JSON.stringify({ jsonrpc: '2.0', id: item.id, method: item.method, params: item.params }))
  }
})
const call = (method, params = {}) => new Promise((resolve) => {
  const id = nextId++
  const send = () => ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }))
  pending.set(id, resolve)
  if (ws.readyState === WebSocket.OPEN) send()
  else queued.push({ id, method, params })  // 排队，open 时按序发出
})

const show = (value) => {
  $('out').textContent = JSON.stringify(value, null, 2)
  const detail = document.getElementById('out-detail')
  if (detail) detail.textContent = JSON.stringify(value, null, 2)
  const chip = $('console-chip')
  if (value && value.error) {
    chip.textContent = '✗ ' + (value.error.message ?? JSON.stringify(value.error)).slice(0, 80)
    chip.style.color = 'var(--xm-danger)'
  } else {
    chip.textContent = '✓ ' + JSON.stringify(value).slice(0, 80)
    chip.style.color = 'var(--xm-faint)'
  }
}
$('console-toggle').addEventListener('click', () => {
  $('console').classList.toggle('open')
})

// ---- 响应式面板 registry（对齐基座 ctx.ui：注册即可渲染，subscribe 可订阅）----
const panels = []            // { def, el, mounted, failed? }
const listeners = new Set()
let activeId = null

const notify = () => listeners.forEach((l) => l())
const sortedPanels = () =>
  [...panels].sort((a, b) => (a.def.order ?? a.seq) - (b.def.order ?? b.seq))

const ui = {
  /** Register a panel (UiPanel-aligned). Duplicate ids throw, like the base. */
  register(def) {
    if (typeof def?.id !== 'string' || typeof def?.mount !== 'function') {
      throw new Error('panel 契约不完整：需要 id 与 mount(el, ctx)')
    }
    if (panels.some((p) => p.def.id === def.id)) {
      throw new Error(`duplicate panel id: ${def.id}`)
    }
    // 每个面板一个视图容器（.view 默认 display:none，激活才显示）
    const section = document.createElement('section')
    section.className = 'view'
    section.id = 'view-' + def.id
    $('main').appendChild(section)
    panels.push({ def, el: section, mounted: false })
    notify()
    return () => ui.unregister(def.id)
  },
  unregister(id) {
    const i = panels.findIndex((p) => p.def.id === id)
    if (i < 0) return false
    panels[i].el?.remove()
    panels.splice(i, 1)
    if (activeId === id) activeId = null
    notify()
    return true
  },
  list: () => panels.map((p) => ({ ...p.def })),
  subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener) },
}

// ---- 渲染：侧栏导航 + 视图容器；激活 = display 切换 + 首次懒挂载 ----------
function renderNav() {
  const nav = $('nav')
  nav.innerHTML = ''
  const groupsSeen = new Map()
  for (const p of sortedPanels()) {
    const group = p.def.group ?? '面板'
    if (!groupsSeen.has(group)) {
      groupsSeen.set(group, true)
      const g = document.createElement('div')
      g.className = 'nav-group'
      g.textContent = group
      nav.appendChild(g)
    }
    const btn = document.createElement('button')
    btn.className = 'nav-item' + (p.def.id === activeId ? ' active' : '')
    btn.dataset.view = p.def.id
    btn.title = p.def.title
    btn.innerHTML = `${p.def.icon ?? ''}<span>${p.def.title}</span>`
    btn.addEventListener('click', () => activate(p.def.id))
    nav.appendChild(btn)
  }
}

function activate(id) {
  const entry = panels.find((p) => p.def.id === id)
  if (!entry) return
  activeId = id
  for (const p of panels) {
    p.el?.classList.toggle('active', p.def.id === id)
  }
  if (!entry.mounted) {
    entry.mounted = true
    try {
      entry.def.mount(entry.el, shellCtx)
    } catch (e) {
      entry.el.innerHTML = `<div class="panel"><h2>${entry.def.title}</h2><pre>插件挂载失败: ${e.message ?? e}</pre></div>`
    }
  }
  for (const btn of $('nav').querySelectorAll('.nav-item')) {
    btn.classList.toggle('active', btn.dataset.view === id)
  }
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id)
}

// ---- 侧栏引擎状态卡（壳自有职责，不属于任何视图插件）-----------------------
const refreshSideHealth = async () => {
  try {
    const res = await fetch(`/api/health${query}`)
    const health = await res.json()
    const engine = health.xmedia
    const dot = $('side-dot')
    const label = $('side-engine')
    if (engine?.running) {
      dot.className = 'dot ok'
      label.textContent = `引擎运行中 · pid ${engine.pid}`
    } else {
      dot.className = 'dot bad'
      label.textContent = '引擎未运行'
    }
  } catch {
    $('side-dot').className = 'dot bad'
    $('side-engine').textContent = '宿主不可达'
  }
}

// ---- 插件加载：manifest 顺序 = 默认顺序；单个失败不白屏（对齐 PanelBoundary）-
// SPA fallback 会把缺失文件回成 index.html(200)，import 解析 HTML 报错——正好
// 落进 catch，注册一个"加载失败"占位面板，其余插件照常。
async function loadPlugins() {
  const seqBase = 10
  let manifest
  try {
    manifest = await (await fetch('./plugins/manifest.json')).json()
  } catch (e) {
    ui.register({
      id: 'loader-error', title: '加载失败', area: 'sidebar',
      icon: '⚠', mount(el) {
        el.innerHTML = `<div class="panel"><h2>插件清单加载失败</h2><pre>${e.message ?? e}</pre></div>`
      },
    })
    boot()
    return
  }
  const files = Array.isArray(manifest?.plugins) ? manifest.plugins : []
  await Promise.allSettled(files.map(async (file, i) => {
    const id = file.replace(/\.js$/, '')
    const seq = seqBase * (i + 1)
    try {
      const mod = await import(`./plugins/${file}`)
      ui.register({ seq, group: mod.default?.group ?? '面板', ...mod.default })
    } catch (e) {
      ui.register({
        id, seq, title: id, group: '面板', icon: '⚠',
        mount(el) {
          el.innerHTML = `<div class="panel"><h2>插件 ${file} 加载失败</h2><pre>${e.message ?? e}</pre></div>`
        },
      })
    }
  }))
  boot()
}

// ---- 插件间事件总线（最小实现）：mtx 的「观看」跳到 live 并自动连接等场景 ----
const busListeners = new Map()   // event -> Set<fn>
const shellCtx = {
  call, show, ui,
  on(event, fn) {
    if (!busListeners.has(event)) busListeners.set(event, new Set())
    busListeners.get(event).add(fn)
    return () => busListeners.get(event)?.delete(fn)
  },
  emit(event, payload) {
    for (const fn of busListeners.get(event) ?? []) {
      try { fn(payload) } catch { /* 一个监听者失败不连坐 */ }
    }
  },
  activate,   // 插件可切换到另一个视图（如「观看」跳到实时预览）
}
window.xmediaCtx = shellCtx  // 对齐基座 window.mediabaseCtx：运行时注册 / 调试入口

ui.subscribe(renderNav)
void refreshSideHealth()
setInterval(() => { void refreshSideHealth() }, 10_000)

const boot = () => {
  const wanted = location.hash.slice(1)
  const target = panels.some((p) => p.def.id === wanted) ? wanted : sortedPanels()[0]?.def.id
  if (target) activate(target)
}
void loadPlugins()
window.addEventListener('hashchange', () => {
  const wanted = location.hash.slice(1)
  if (panels.some((p) => p.def.id === wanted)) activate(wanted)
})
</script>
</body>
</html>
